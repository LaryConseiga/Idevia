# Base locale de développement uniquement (la production utilise Neon).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: idevia_owner
      POSTGRES_PASSWORD: idevia_owner_dev
      POSTGRES_DB: idevia
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - idevia-pg:/var/lib/postgresql/data
      - ./scripts/db/init-local.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  idevia-pg:
